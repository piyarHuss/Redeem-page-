<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Rewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; }
        
        .header-bg { background: linear-gradient(90deg, #6b46c1 0%, #805ad5 100%); }
        .reward-card { background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%); }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%; background: #7c3aed;
            cursor: pointer; margin-top: -8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer;
            background: #e5e7eb; border-radius: 5px;
        }
        .upi-box.selected {
            border-color: #7c3aed; background-color: #f3e8ff; color: #5b21b6;
        }
        .status-pending { background-color: #fef9c3; color: #854d0e; }
        .status-success { background-color: #dcfce7; color: #166534; }
        .status-rejected { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <!-- HEADER -->
    <header class="header-bg text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-gift text-2xl animate-bounce"></i>
                <div>
                    <h1 class="font-bold text-xl leading-tight">Redeem<br>Rewards</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <p class="text-xs opacity-80">Balance</p>
                    <p class="font-bold text-lg">₹<span id="headerBalance">0.00</span></p>
                </div>
                <div class="bg-white/20 p-2 rounded-full cursor-pointer">
                    <i class="fas fa-user text-lg"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- REDEEM SECTION -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-center text-xl font-bold text-gray-800 mb-2">Redeem Your Code</h2>
            <div class="mb-4">
                <label class="text-sm font-semibold text-gray-600 ml-1">Enter Redeem Code</label>
                <input type="text" id="codeInput" placeholder="Ex: WIN100" class="w-full mt-2 p-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none text-center text-lg font-bold tracking-widest uppercase text-purple-700 transition">
            </div>
            <button id="btnRedeem" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-purple-200 transition active:scale-95">
                Redeem
            </button>
            <p id="redeemMsg" class="text-center text-xs mt-3 font-medium h-4"></p>
        </div>

        <!-- REWARD BANNER -->
        <div class="reward-card text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
            <i class="fas fa-coins absolute -right-4 -bottom-4 text-8xl opacity-20"></i>
            <h3 class="font-semibold text-lg">Cash Reward</h3>
            <h2 class="text-4xl font-bold mt-1">₹100 - ₹500</h2>
            <p class="text-xs mt-4 opacity-90 bg-white/20 inline-block px-3 py-1 rounded-full">
                <i class="fas fa-bolt mr-1"></i> Limited Users Only
            </p>
        </div>

        <!-- WITHDRAWAL SECTION -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-center text-xl font-bold text-gray-800 mb-6">Withdraw Earnings</h2>

            <div class="flex justify-between items-end mb-2">
                <span class="text-gray-500 text-sm font-medium">Withdrawal Amount</span>
                <span class="text-2xl font-bold text-purple-600">₹<span id="withdrawDisplay">0</span></span>
            </div>

            <input type="range" id="amountSlider" min="1" max="5000" value="0" step="1" class="w-full mb-1">
            <div class="flex justify-between text-xs text-gray-400 mb-6"><span>₹1</span><span>₹5000</span></div>

            <p class="text-sm font-semibold text-gray-600 mb-3">Select UPI ID</p>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div onclick="selectMethod('paytm')" id="box-paytm" class="upi-box border-2 border-gray-100 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer transition hover:bg-gray-50">
                    <i class="fas fa-wallet text-blue-400"></i> <span class="font-medium text-sm">Paytm</span>
                </div>
                <div onclick="selectMethod('phonepe')" id="box-phonepe" class="upi-box border-2 border-gray-100 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer transition hover:bg-gray-50">
                    <i class="fas fa-mobile-alt text-purple-500"></i> <span class="font-medium text-sm">PhonePe</span>
                </div>
                <div onclick="selectMethod('gpay')" id="box-gpay" class="upi-box border-2 border-gray-100 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer transition hover:bg-gray-50">
                    <i class="fab fa-google text-green-500"></i> <span class="font-medium text-sm">GPay</span>
                </div>
                <div onclick="selectMethod('other')" id="box-other" class="upi-box border-2 border-gray-100 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer transition hover:bg-gray-50">
                    <i class="fas fa-ellipsis-h text-gray-400"></i> <span class="font-medium text-sm">Other</span>
                </div>
            </div>

            <input type="text" id="upiInput" placeholder="Enter UPI ID" class="w-full p-3 border rounded-xl bg-gray-50 text-sm mb-4 focus:outline-none focus:border-purple-500 hidden">

            <button onclick="processWithdraw()" id="btnWithdraw" class="w-full bg-purple-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95">
                Apply for Withdrawal
            </button>
        </div>

        <!-- HISTORY SECTION -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">History</h2>
                <i class="fas fa-history text-gray-400"></i>
            </div>
            
            <div id="historyList" class="space-y-3">
                <p class="text-center text-gray-400 text-sm py-4">No withdrawals yet</p>
            </div>
        </div>

        <div class="text-center pt-4 pb-8">
            <p class="text-xs text-gray-500">App Version 1.4</p>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, update, runTransaction, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // *** FIREBASE CONFIG ***
        const firebaseConfig = {
            apiKey: "AIzaSyAFWVAKbl9GHTReWK14ipnOPewLlpXXUHo",
            authDomain: "tournament-85d62.firebaseapp.com",
            databaseURL: "https://tournament-85d62-default-rtdb.firebaseio.com",
            projectId: "tournament-85d62",
            storageBucket: "tournament-85d62.firebasestorage.app",
            messagingSenderId: "1088462673525",
            appId: "1:1088462673525:web:f50eaec451712d43b8ca3c",
            measurementId: "G-B1SN2W0BWJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userId = localStorage.getItem('unique_user_id');
        if (!userId) {
            userId = 'user_' + Math.floor(Math.random() * 1000000);
            localStorage.setItem('unique_user_id', userId);
        }
        
        // *** STEP 0: THIS FIXES THE ADMIN PANEL STATS ***
        // Check if user exists, if not create. Update lastActive time.
        get(ref(db, 'users/' + userId)).then((snap) => {
            if(!snap.exists()) {
                // New User: Create entry with 0 balance
                update(ref(db, 'users/' + userId), {
                    balance: 0,
                    lastActive: Date.now(),
                    joinedAt: Date.now()
                });
            } else {
                // Existing User: Just update active time
                update(ref(db, 'users/' + userId), {
                    lastActive: Date.now()
                });
            }
        });

        let userBalance = 0;
        let selectedPaymentMethod = '';

        // 1. LOAD BALANCE
        const userRef = ref(db, 'users/' + userId);
        onValue(userRef, (snapshot) => {
            const data = snapshot.val();
            userBalance = (data && data.balance) ? data.balance : 0;
            updateUI();
        });

        // 2. LOAD WITHDRAWAL HISTORY
        const historyRef = ref(db, `users/${userId}/withdrawals`);
        onValue(historyRef, (snapshot) => {
            const listDiv = document.getElementById('historyList');
            listDiv.innerHTML = ""; 

            if (!snapshot.exists()) {
                listDiv.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">No withdrawals yet</p>';
                return;
            }

            const data = snapshot.val();
            const entries = Object.entries(data).reverse();

            entries.forEach(([key, item]) => {
                const date = new Date(item.timestamp).toLocaleDateString('en-IN', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit'
                });

                let statusClass = "status-pending";
                let iconClass = "fa-clock";
                if(item.status === 'success') { statusClass = "status-success"; iconClass = "fa-check-circle"; }
                if(item.status === 'rejected') { statusClass = "status-rejected"; iconClass = "fa-times-circle"; }

                const row = `
                    <div class="flex justify-between items-center p-3 border border-gray-100 rounded-xl bg-gray-50">
                        <div class="flex items-center gap-3">
                            <div class="bg-white p-2 rounded-lg shadow-sm">
                                <i class="fas fa-wallet text-purple-600"></i>
                            </div>
                            <div>
                                <p class="font-bold text-gray-800">₹${item.amount}</p>
                                <p class="text-xs text-gray-500">${date}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="${statusClass} text-xs font-bold px-2 py-1 rounded-full uppercase flex items-center gap-1">
                                <i class="fas ${iconClass}"></i> ${item.status}
                            </span>
                            <p class="text-xs text-gray-400 mt-1">${item.method}</p>
                        </div>
                    </div>
                `;
                listDiv.innerHTML += row;
            });
        });

        function updateUI() {
            document.getElementById('headerBalance').innerText = userBalance.toFixed(2);
            const slider = document.getElementById('amountSlider');
            slider.max = userBalance > 0 ? userBalance : 100; 
            
            const withdrawBtn = document.getElementById('btnWithdraw');
            if(userBalance < 1) {
                withdrawBtn.innerText = "Min Withdraw ₹1";
                withdrawBtn.disabled = true;
            } else {
                withdrawBtn.innerText = "Apply for Withdrawal";
                withdrawBtn.disabled = false;
            }
        }

        // REDEEM LOGIC
        document.getElementById('btnRedeem').addEventListener('click', async () => {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            const btn = document.getElementById('btnRedeem');

            if(!code) { showMessage("Please enter a code", "red"); return; }
            
            // *** ADSTERRA DIRECT LINK TRIGGER ***
            // This opens the ad in a new tab when the button is clicked
            window.open("https://www.effectivegatecpm.com/bp4zjq8q?key=14a26d100d064f0f2fa9c543d4bf07f7", "_blank");

            btn.disabled = true; btn.innerText = "Checking...";

            try {
                const historyRef = ref(db, `users/${userId}/history/${code}`);
                const historySnap = await get(historyRef);
                if (historySnap.exists()) {
                    showMessage("Already Used!", "orange"); btn.disabled = false; btn.innerText = "Redeem"; return;
                }

                const codeRef = ref(db, 'codes/' + code);
                const result = await runTransaction(codeRef, (current) => {
                    if (current === null) return current;
                    if (current.active && current.used_count < current.limit) {
                        current.used_count++; return current;
                    } else { return; }
                });

                if (result.committed) {
                    const codeData = result.snapshot.val();
                    await creditUser(code, codeData.amount);
                } else {
                    showMessage("Code Invalid or Expired", "red");
                }
            } catch (e) {
                console.error(e);
                showMessage("Error Occurred", "red");
            } finally {
                btn.disabled = false; btn.innerText = "Redeem";
            }
        });

        async function creditUser(code, amount) {
            const updates = {};
            updates[`users/${userId}/balance`] = userBalance + amount;
            updates[`users/${userId}/history/${code}`] = { amount: amount, timestamp: Date.now() };
            
            // Also update lastActive here
            updates[`users/${userId}/lastActive`] = Date.now();

            await update(ref(db), updates);
            showMessage(`Success! ₹${amount} Added.`, "green");
            document.getElementById('codeInput').value = "";
        }

        function showMessage(text, color) {
            const el = document.getElementById('redeemMsg');
            el.innerText = text; el.className = `text-center text-xs mt-3 font-medium h-4 text-${color}-600`;
            setTimeout(() => el.innerText = "", 4000);
        }

        // WITHDRAWAL LOGIC
        const slider = document.getElementById('amountSlider');
        const display = document.getElementById('withdrawDisplay');
        
        slider.addEventListener('input', (e) => {
            if(userBalance < 1) { display.innerText = "0"; return; }
            let val = parseInt(e.target.value);
            if(val > userBalance) val = Math.floor(userBalance);
            if(val < 1 && userBalance >=1) val = 1;
            display.innerText = val;
        });

        window.selectMethod = function(method) {
            selectedPaymentMethod = method;
            document.querySelectorAll('.upi-box').forEach(el => el.classList.remove('selected'));
            document.getElementById('box-' + method).classList.add('selected');
            const upiInput = document.getElementById('upiInput');
            upiInput.classList.remove('hidden');
            upiInput.focus();
        }

        window.processWithdraw = async function() {
            const amount = parseInt(document.getElementById('withdrawDisplay').innerText);
            const upi = document.getElementById('upiInput').value;
            const btn = document.getElementById('btnWithdraw');

            if(amount < 1) { alert("Minimum withdrawal is ₹1"); return; }
            if(amount > userBalance) { alert("Insufficient Balance"); return; }
            if(!selectedPaymentMethod || !upi) { alert("Please enter Payment Details"); return; }

            btn.disabled = true; btn.innerText = "Processing...";

            const newTxRef = push(ref(db, 'withdrawals')); 
            const txId = newTxRef.key;

            const withdrawData = {
                userId: userId,
                amount: amount,
                method: selectedPaymentMethod,
                upi_id: upi,
                status: 'pending',
                timestamp: Date.now(),
                id: txId
            };

            try {
                const updates = {};
                updates[`users/${userId}/balance`] = userBalance - amount;
                updates[`withdrawals/${txId}`] = withdrawData;
                updates[`users/${userId}/withdrawals/${txId}`] = withdrawData;
                
                // Update active status
                updates[`users/${userId}/lastActive`] = Date.now();

                await update(ref(db), updates);

                alert("Withdrawal Requested!");
                document.getElementById('upiInput').value = "";
                document.getElementById('withdrawDisplay').innerText = "0";
                slider.value = 0;
            } catch(e) {
                alert("Error processing withdrawal");
                console.error(e);
            } finally {
                btn.disabled = false; btn.innerText = "Apply for Withdrawal";
            }
        }
    </script>
    
    <!-- Previous Social Bar Script (Optional, kept as requested before) -->
    <script src="//pl28547566.effectivegatecpm.com/25/42/ac/2542ac18619eecb9f81875e46cfff693.js"></script>
</body>
</html>
